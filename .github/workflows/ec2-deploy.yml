
name: Deploy EC2

on:
  workflow_run:
    workflows: ["Builds and Tests"]
    types:
      - completed

jobs:
  Deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (
        github.event.workflow_run.head_branch == 'develop' ||
        github.event.workflow_run.head_branch == 'main'
      )

    name: Implantação AWS
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event.workflow_run.head_branch == 'develop' && 'homologacao' || 'producao' }}

    steps:
      - name: Deploy via SSH na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker pull gabesant/minha-api-github-actions:${{ github.event.workflow_run.head_sha }}

            docker stop minha-api 2>/dev/null || true
            docker rm minha-api 2>/dev/null || true

            docker run -d \
              --name minha-api \
              --restart unless-stopped \
              -p 8080:8080 \
              gabesant/minha-api-github-actions:${{ github.event.workflow_run.head_sha }}

            sleep 5

            curl -f http://localhost:8080/health || exit 1

            docker image prune -f
